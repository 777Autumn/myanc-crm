# Native Mac template for the pinned CLI. Install with root-owned configuration;
# legacy isolated identities log in separately. The optional anc-shared profile
# supports the paired gateway's single native owner for fixed trusted entrances.
model = "gpt-6-luna"
model_reasoning_effort = "medium"
cli_auth_credentials_store = "file"
check_for_update_on_startup = false
approval_policy = "never"
default_permissions = "anc-work"

[features]
network_proxy = true

[permissions.anc-work]
extends = ":workspace"

[permissions.anc-work.filesystem]
"~/.codex" = "deny"

[permissions.anc-work.filesystem.":workspace_roots"]
"AGENTS.override.md" = "read"
"AGENTS.md" = "read"
"CLAUDE.md" = "read"
".agents" = "read"
".claude" = "read"
".codex" = "read"
".mcp.json" = "read"

# Only host tools on loopback are allowed by the tool network proxy. This is a
# hostname rule, NOT a port ACL. OS accounts and host capabilities remain required.
# The app-server's own model requests use the separately installed network proxy.
# On Darwin the paired gateway also grants this work's exact LibreOffice Unix
# socket to model tools. Other Unix/management sockets stay blocked. The converter
# serializes a fresh outputs/.office-profile; stale profile/socket means stop and
# inspect the prior process, never delete it and retry automatically. Native macOS
# spellchecking is disabled only inside the one-shot Office conversion process.
[permissions.anc-work.network]
enabled = true
proxy_url = "http://127.0.0.1:0"
enable_socks5 = false
allow_upstream_proxy = false
allow_local_binding = false

[permissions.anc-work.network.domains]
"127.0.0.1" = "allow"

# Opt-in shared owner: select permission_profile="anc-shared" and
# shared_app_server=true in the paired gateway. No :workspace inheritance:
# work roots, read-only rule anchors and the exact Office socket are injected
# for one native thread only. Keep this config root-owned outside all work roots.
[permissions.anc-shared.filesystem]
":minimal" = "read"
"/opt/team-files" = "read"
"/opt/homebrew" = "read"
"/Library/Frameworks/Python.framework" = "read"
"/Applications/LibreOffice.app" = "read"
"/Library/Fonts" = "read"
"/System/Library/Fonts" = "read"

[permissions.anc-shared.network]
enabled = true
proxy_url = "http://127.0.0.1:0"
enable_socks5 = false
allow_upstream_proxy = false
allow_local_binding = false

[permissions.anc-shared.network.domains]
"127.0.0.1" = "allow"
