name: CI

on:
  push:
  pull_request:

jobs:
  mac-maintenance:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Native maintenance and ordinary daemon fixture
        run: |
          python -m unittest discover -s tests -p 'test_maintenance*.py' -v
          sudo env ANC_LAUNCHD_FIXTURE=1 SUDO_USER="$USER" "$(which python)" -m unittest discover -s tests -p test_maintenance_launchd.py -v
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate configuration template
        run: python -m json.tool config.example.json > /dev/null
      - name: Compile Python
        run: python -m compileall -q myanc_crm ops tests spikes
      - name: Check bootstrap dry run
        run: >-
          python ops/bootstrap_base.py
          --lark-cli /opt/lark-cli
          --profile ci-placeholder
          --wrapper-path /opt/lark-enterprise
          --dry-run
      - name: Run tests
        # Only the locked document packages are installed on the temporary runner.
        # This is not authorization to install anything on the existing VPS.
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          python -m pip install -r ops/runtime/team-files-requirements.txt
          python -m unittest discover -s tests -v
          python -m unittest discover -s spikes -v
          python -m unittest discover -s ops/runtime -v
      - name: Verify isolated numeric UID fixtures
        run: sudo $(which python) ops/runtime/test_partner_boundary.py
      - name: Scan tracked files for credential-shaped values
        shell: bash
        run: |
          test -z "$(git ls-files config.local.json)"
          if git grep -En 'cli_[[:alnum:]]{16,}|ou_[[:alnum:]]{16,}|(app_secret|client_secret|access_token|refresh_token)[^[:alnum:]]{1,12}[[:alnum:]_./+-]{16,}' -- .; then
            echo "credential-shaped value found in a tracked file" >&2
            exit 1
          fi
